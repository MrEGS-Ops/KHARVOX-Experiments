      - name: Configure native build
        run: cmake -S . -B build/native -G "Visual Studio 17 2022" -A x64 -DKHARVOX_BUILD_LAYER=ON -DBUILD_TESTING=OFF
      - name: Compile renderer
        run: cmake --build build/native --config Release --target KharvoxLayer --parallel 2
      - name: Package separate-copy installer and probe
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, shutil, struct
          p = Path('probe-package')
          p.mkdir()
          dll = Path('build/native/Release/KharvoxLayer.dll')
          b = dll.read_bytes()
          assert b[:2] == b'MZ', 'Missing Windows DLL header'
          offset = struct.unpack_from('<I', b, 0x3c)[0]
          assert b[offset:offset+4] == b'PE\0\0' and struct.unpack_from('<H', b, offset+4)[0] == 0x8664, 'DLL must be Windows x64'
          shutil.copy2(dll, p / dll.name)
          payload = json.loads('{"Install-Probe.cmd": "@echo off\\npowershell.exe -NoProfile -ExecutionPolicy Bypass -File \\"%~dp0Install-Probe.ps1\\"\\n", "Install-Probe.ps1": "$ErrorActionPreference = \'Stop\'\\ntry {\\n    $source = (Read-Host \'Paste the folder containing your WORKING KharvoxLauncher.exe\').Trim().Trim(\'\\"\')\\n    $source = (Resolve-Path -LiteralPath $source).Path\\n    foreach ($name in @(\'KharvoxLauncher.exe\',\'KharvoxLayer.dll\',\'KharvoxLayer.json\',\'openxr_loader.dll\')) {\\n        if (!(Test-Path -LiteralPath (Join-Path $source $name) -PathType Leaf)) {\\n            throw \\"Missing $name in that folder. Select the working baseline Release folder.\\"\\n        }\\n    }\\n    $payload = Join-Path $PSScriptRoot \'KharvoxLayer.dll\'\\n    if (!(Test-Path -LiteralPath $payload)) { throw \'Download and extract the GitHub Actions artifact first. This source kit is not a compiled build.\' }\\n    $expected = (Get-Content -LiteralPath (Join-Path $PSScriptRoot \'LAYER-SHA256.txt\') -Raw).Trim()\\n    if ((Get-FileHash -LiteralPath $payload -Algorithm SHA256).Hash -ne $expected) { throw \'Diagnostic DLL checksum mismatch. Download the artifact again.\' }\\n    if ((Get-Item -LiteralPath (Join-Path $source \'KharvoxLayer.dll\')).VersionInfo.FileVersion -ne (Get-Item -LiteralPath $payload).VersionInfo.FileVersion) {\\n        throw \'Baseline and diagnostic DLL versions differ. Use the baseline build tested in this conversation.\'\\n    }\\n    $parent = Split-Path -Parent $source\\n    $destination = Join-Path $parent (\'KHARVOX-Probe-\' + (Get-Date -Format \'yyyyMMdd-HHmmss\') + \'-\' + [guid]::NewGuid().ToString(\'N\').Substring(0,6))\\n    if (Test-Path -LiteralPath $destination) { throw \'Destination already exists.\' }\\n    New-Item -ItemType Directory -Path $destination | Out-Null\\n    Get-ChildItem -LiteralPath $source -Force | Copy-Item -Destination $destination -Recurse -Force\\n    Copy-Item -LiteralPath $payload -Destination (Join-Path $destination \'KharvoxLayer.dll\') -Force\\n    foreach ($name in @(\'Collect-Probe.cmd\',\'Collect-Probe.ps1\',\'TESTING.txt\',\'BUILD-INFO.txt\',\'Compare-Depth.html\')) {\\n        Copy-Item -LiteralPath (Join-Path $PSScriptRoot $name) -Destination $destination\\n    }\\n    New-Item -ItemType File -Path (Join-Path $destination \'enable_upscaler_probe\') -Force | Out-Null\\n    New-Item -ItemType File -Path (Join-Path $destination \'enable_depth_readback\') -Force | Out-Null\\n    Write-Host \\"Installed into a separate copy: $destination\\"\\n    Write-Host \'Open that folder and run KharvoxLauncher.exe. Your original folder is unchanged.\'\\n    Start-Process explorer.exe -ArgumentList (\'\\"\' + $destination + \'\\"\')\\n} catch {\\n    Write-Host \\"INSTALL FAILED: $($_.Exception.Message)\\" -ForegroundColor Red\\n    Read-Host \'Press Enter to close\'\\n    exit 1\\n}\\nRead-Host \'Press Enter to close\'\\n", "Collect-Probe.cmd": "@echo off\\npowershell.exe -NoProfile -ExecutionPolicy Bypass -File \\"%~dp0Collect-Probe.ps1\\"\\n", "Collect-Probe.ps1": "$ErrorActionPreference = \'Stop\'\\ntry {\\n    $log = Join-Path $env:TEMP \'KHARVOX.log\'\\n    if (!(Test-Path -LiteralPath $log)) { throw \'No KHARVOX.log found. Run the diagnostic copy first.\' }\\n    $lines = @(Get-Content -LiteralPath $log | Where-Object { $_.Contains(\'[UPSCALER-PROBE]\') })\\n    $start = -1\\n    for ($i=0; $i -lt $lines.Count; $i++) {\\n        if ($lines[$i].Contains(\'[UPSCALER-PROBE] enabled;\')) { $start = $i }\\n    }\\n    if ($start -lt 0) { throw \'No diagnostic session found. Check that you launched the separate diagnostic folder.\' }\\n    $latest = @($lines[$start..($lines.Count-1)])\\n    if (!($latest | Where-Object { $_.Contains(\' eye=\') })) {\\n        Write-Warning \'The probe started but recorded no stereo frames. Include this result and describe what happened.\'\\n    }\\n    $bundle = Join-Path $PSScriptRoot (\'KHARVOX-Depth-Results-\' + (Get-Date -Format \'yyyyMMdd-HHmmss\') + \'-\' + [guid]::NewGuid().ToString(\'N\').Substring(0,6))\\n    New-Item -ItemType Directory -Path $bundle | Out-Null\\n    $destination = Join-Path $bundle \'Probe-Results.txt\'\\n    @(\'KHARVOX colour/depth snapshot probe; no temporal upscaler implemented.\', (\'Collected: \' + (Get-Date -Format o))) +\\n        @(Get-Content -LiteralPath (Join-Path $PSScriptRoot \'BUILD-INFO.txt\')) + $latest |\\n        Set-Content -LiteralPath $destination -Encoding UTF8\\n    $captureRoot = [IO.Path]::GetFullPath((Join-Path $env:TEMP \'KHARVOX-DepthCaptures\')) + [IO.Path]::DirectorySeparatorChar\\n    $directories = @($latest | ForEach-Object {\\n        if ($_ -match \'captureSaved=[01] eye=[01] directory=(.+)$\') { $Matches[1] }\\n    } | Select-Object -Unique)\\n    foreach ($directory in $directories) {\\n        $full = [IO.Path]::GetFullPath($directory)\\n        if (!$full.StartsWith($captureRoot, [StringComparison]::OrdinalIgnoreCase)) { throw \'Unexpected capture directory in log.\' }\\n        foreach ($name in @(\'left-colour.png\',\'right-colour.png\',\'left-depth.png\',\'right-depth.png\',\'left-metadata.txt\',\'right-metadata.txt\')) {\\n            $file = Join-Path $full $name\\n            if (Test-Path -LiteralPath $file -PathType Leaf) { Copy-Item -LiteralPath $file -Destination $bundle }\\n        }\\n    }\\n    Copy-Item -LiteralPath (Join-Path $PSScriptRoot \'Compare-Depth.html\') -Destination $bundle\\n    $archive = $bundle + \'.zip\'\\n    Compress-Archive -LiteralPath $bundle -DestinationPath $archive\\n    Write-Host \\"Upload this ZIP in the chat: $archive\\"\\n    Write-Host \'The results folder also has Compare-Depth.html for viewing the screenshots.\'\\n    if ($directories.Count -eq 0) { Write-Warning \'No captured images were found. Send the ZIP anyway; it contains the diagnostic reason if one was logged.\' }\\n} catch {\\n    Write-Host \\"COLLECTION FAILED: $($_.Exception.Message)\\" -ForegroundColor Red\\n    Read-Host \'Press Enter to close\'\\n    exit 1\\n}\\nRead-Host \'Press Enter to close\'\\n", "TESTING.txt": "KHARVOX COLOUR/DEPTH SNAPSHOT PROBE 3\\n\\nPURPOSE\\nCapture one colour image and one candidate depth image per eye, for checking\\nwhether scene outlines align. This does not implement FSR2, DLSS, optical flow,\\nframe generation or a persistent temporal depth cache. Separate eyes are\\ncaptured on separate AER frames. Correct motion/jitter inputs remain unknown.\\n\\nINSTALL THE COMPILED ACTIONS ARTIFACT\\n1. Extract the NEW KHARVOX-Probe-Windows artifact completely.\\n2. Double-click Install-Probe.cmd.\\n3. Paste the folder containing your working baseline KharvoxLauncher.exe.\\n4. The installer makes and opens a separate sibling copy and replaces only\\n   that copy\'s renderer DLL. It needs no administrator privileges.\\n\\nTEST\\n1. Close any other KHARVOX/DOOM session.\\n2. Run KharvoxLauncher.exe FROM THE NEW KHARVOX-Probe folder.\\n3. Connect Quest 3 using your usual Virtual Desktop/VDXR configuration.\\n4. Use AER with hands enabled, as in your successful previous test. Keep your\\n   working render scale and other settings. Hands enable the depth tracker.\\n5. Load a level promptly and play for about 60 seconds. Capture is attempted\\n   once per eye, about 20 seconds after the first eligible stereo scene.\\n   A brief hitch during capture is expected; no performance gain is expected.\\n6. Exit normally. Double-click Collect-Probe.cmd in the NEW folder.\\n7. Upload its KHARVOX-Depth-Results-*.zip here, including if no images appear.\\n   Tell me if the game crashed or either eye looked wrong.\\n8. To inspect locally, open Compare-Depth.html in the results folder. Slide\\n   each overlay to compare colour and depth edges. White means nearer, black\\n   farther; this is contrast-enhanced device depth, not distance in metres.\\n   Magenta pixels indicate invalid depth values. UI/effects may lack depth.\\n\\nThe collector packages the latest diagnostic session\'s probe lines, build\\nmetadata, captured PNGs, per-eye metadata and offline comparison page.\\nIt does not export the complete runtime log. Screenshots show the game scene.\\n\\nSUPPORTED CAPTURE\\nThe probe only reads eligible single-sample depth images already supporting\\ntransfer-source usage, with matching dimensions and supported subresources.\\nUnsupported targets are skipped and logged; the ZIP still helps diagnose why.\\nDepth layouts are restored after copying. CPU access happens only following\\nsuccessful GPU completion. No game image-creation flags are changed.\\n\\nROLLBACK\\nClose the game and launch your original working baseline folder. No original\\nfiles were replaced. The diagnostic copy can be deleted when finished.\\n\\nVALIDATION STATUS\\nLocal C++ syntax and depth-tracker tests passed. Windows compilation,\\nPowerShell execution and headset behaviour remain to be tested. This is an\\nexperimental diagnostic prerequisite, not one of the three promised upscalers.\\n", "Compare-Depth.html": "<!doctype html>\\n<html lang=\\"en\\"><meta charset=\\"utf-8\\"><meta name=\\"viewport\\" content=\\"width=device-width, initial-scale=1\\">\\n<title>KHARVOX colour and depth comparison</title>\\n<style>\\nbody{font:17px/1.5 system-ui,sans-serif;margin:32px;background:#15191d;color:#e9edf1;max-width:1500px}\\nh1{font-size:28px}p{max-width:950px}.pair{position:relative;background:#333;min-height:80px}\\n.pair img[hidden]{display:none}.pair img{display:block;width:100%;height:auto}.pair .depth{position:absolute;inset:0;opacity:.5}\\nlabel{display:block;margin:15px 0}input{width:min(500px,80%);vertical-align:middle}section{margin:32px 0}\\n.error{color:#ffb5a8}a{color:#86cfff}\\n</style>\\n<h1>KHARVOX: compare colour with depth</h1>\\n<p>Move each slider from colour to depth. Check that walls and enemy silhouettes line up within that eye\'s two images.\\nWhite represents nearer depth and black farther depth, using enhanced contrast rather than distances in metres.\\nMagenta marks invalid depth values.</p>\\n<p>These are single snapshots. Left and right were captured on separate AER frames; differences between eyes can include motion.\\nThese pictures cannot establish motion-vector correctness or frame-to-frame stability. HUD and effects may have no matching scene depth.</p>\\n<section><h2>Left eye</h2><label>Colour <input id=\\"left-slider\\" aria-label=\\"Left eye depth opacity\\" type=\\"range\\" min=\\"0\\" max=\\"100\\" value=\\"50\\"> Depth</label>\\n<div class=\\"pair\\"><img src=\\"left-colour.png\\" alt=\\"Left colour capture\\"><img class=\\"depth\\" id=\\"left-depth\\" src=\\"left-depth.png\\" alt=\\"Left depth capture\\"></div>\\n<p><a href=\\"left-metadata.txt\\">Left capture details</a></p></section>\\n<section><h2>Right eye</h2><label>Colour <input id=\\"right-slider\\" aria-label=\\"Right eye depth opacity\\" type=\\"range\\" min=\\"0\\" max=\\"100\\" value=\\"50\\"> Depth</label>\\n<div class=\\"pair\\"><img src=\\"right-colour.png\\" alt=\\"Right colour capture\\"><img class=\\"depth\\" id=\\"right-depth\\" src=\\"right-depth.png\\" alt=\\"Right depth capture\\"></div>\\n<p><a href=\\"right-metadata.txt\\">Right capture details</a></p></section>\\n<p><a href=\\"Probe-Results.txt\\">Probe log</a></p>\\n<script>\\nfor(const eye of [\'left\',\'right\'])document.getElementById(eye+\'-slider\').addEventListener(\'input\',e=>{\\ndocument.getElementById(eye+\'-depth\').style.opacity=e.target.value/100;});\\ndocument.querySelectorAll(\'img\').forEach(img=>img.addEventListener(\'error\',()=>{\\nconst p=document.createElement(\'p\');p.className=\'error\';p.textContent=\'Missing \'+img.getAttribute(\'src\')+\'. Send the results ZIP; the log may explain why capture was skipped.\';\\nimg.parentElement.after(p);img.hidden=true;}));\\n</script></html>\\n"}')
          for name, content in payload.items():
              (p / name).write_text(content, encoding='utf-8', newline='\r\n')
          (p / 'LAYER-SHA256.txt').write_text(hashlib.sha256(b).hexdigest() + '\n')
          (p / 'BUILD-INFO.txt').write_text('Probe: colour-depth-snapshot-3\nBaseline commit: 0cd5f291fb371d94cb17da32f49f8a7aa0e44623\nPatched bootstrap SHA256: a78356c634aea7e43be191e9a0a77657f38ea61a7cd5019ce7ab2b26ae37e8f5\nTemporal backends: none\n')
          shutil.copy2('LICENSE.txt', p / 'LICENSE.txt')
          shutil.copy2('Docs/THIRD_PARTY_NOTICES.txt', p / 'THIRD_PARTY_NOTICES.txt')
      - name: Save diagnostic test kit
        uses: actions/upload-artifact@v4
        with:
          name: KHARVOX-Probe-Windows
          retention-days: 14
          if-no-files-found: error
          path: probe-package/
