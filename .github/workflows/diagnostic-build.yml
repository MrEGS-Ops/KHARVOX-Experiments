          before_hashes = {'src/openxr/OpenXRBootstrap.cpp': 'c8a6cff2a593b6457b564394ee231f0c34e261dc032a11c54da10b1fae21b79c', 'src/vulkan/KharvoxLayer.cpp': '496b1eec07e985800137bc4fb246b5df66a41c203bbe11c3b55fb7e55c18d5d9', 'src/hands/HandSceneDepthTracker.cpp': '19b0415ba14fd86f65fb2c2b3c8486ec3fa12b828eecd98c64def42c84d87fbc', 'src/hands/HandSceneDepthTracker.h': '4d28553326dcbc85c3ac61bcb968bff09bfac9d5f47ddcde3a55764d3dfde9fe', 'tests/hand_scene_depth_tracker_tests.cpp': '84da7d4831d75c46940b6e0af6a9727ae72581fa32e1a8ef98dc129ae508fa78'}
