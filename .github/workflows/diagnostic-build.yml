cpp\nindex 2388473..bd30249 100644\n--- a/tests/hand_scene_depth_tracker_tests.cpp\n+++ b/tests/hand_scene_depth_tracker_tests.cpp\n@@ -50,6 +50,39 @@ int main(){\n     assert(left.depthImage==depths[0]&&right.depthImage==depths[1]);\n     assert(left.depthView==depthViews[0]&&right.depthView==depthViews[1]);\n     assert(!left.reverseDepth&&right.reverseDepth);\n+    // GPU readback must reject missing transfer usage and ambiguous subresources.\n+    HandSceneTarget readable{};\n+    std::string readbackDiagnostic;\n+    assert(!handSceneReadbackTarget(colors[0],extent,readable));\n+    VkImageCreateInfo readImage{VK_STRUCTURE_TYPE_IMAGE_CREATE_INFO};\n+    readImage.imageType=VK_IMAGE_TYPE_2D;readImage.extent={640,480,1};\n+    readImage.mipLevels=1;readImage.arrayLayers=1;readImage.samples=VK_SAMPLE_COUNT_1_BIT;\n+    readImage.format=VK_FORMAT_D32_SFLOAT;\n+    readImage.usage=VK_IMAGE_USAGE_DEPTH_STENCIL_ATTACHMENT_BIT|VK_IMAGE_USAGE_TRANSFER_SRC_BIT;\n+    handSceneImageCreated(depths[0],readImage);\n+    VkImageViewCreateInfo readView{VK_STRUCTURE_TYPE_IMAGE_VIEW_CREATE_INFO};\n+    readView.image=depths[0];readView.format=VK_FORMAT_D32_SFLOAT;\n+    readView.subresourceRange={VK_IMAGE_ASPECT_DEPTH_BIT,0,1,0,1};\n+    handSceneImageViewCreated(depthViews[0],readView);\n+    assert(handSceneReadbackTarget(colors[0],extent,readable)&&readable.depthImage==depths[0]);\n+    readImage.usage=VK_IMAGE_USAGE_DEPTH_STENCIL_ATTACHMENT_BIT;\n+    handSceneImageCreated(depths[0],readImage);\n+    assert(!handSceneReadbackTarget(colors[0],extent,readable,&readbackDiagnostic));\n+    assert(readbackDiagnostic.find("checks=missing-transfer-source-usage ")!=std::string::npos);\n+    assert(!readable.depthImage);\n+    readImage.usage|=VK_IMAGE_USAGE_TRANSFER_SRC_BIT;\n+    readImage.arrayLayers=2;handSceneImageCreated(depths[0],readImage);\n+    assert(!handSceneReadbackTarget(colors[0],extent,readable,&readbackDiagnostic));\n+    assert(readbackDiagnostic.find("unsupported-image-shape-or-flags")!=std::string::npos);\n+    assert(readbackDiagnostic.find("arrayLayers=2")!=std::string::npos);\n+    readImage.arrayLayers=1;handSceneImageCreated(depths[0],readImage);\n+    readView.subresourceRange.baseMipLevel=1;handSceneImageViewCreated(depthViews[0],readView);\n+    assert(!handSceneReadbackTarget(colors[0],extent,readable,&readbackDiagnostic));\n+    assert(readbackDiagnostic.find("unsupported-view-subresource")!=std::string::npos);\n+    readView.subresourceRange.baseMipLevel=0;handSceneImageViewCreated(depthViews[0],readView);\n+    assert(!handSceneReadbackTarget(colors[0],{320,240},readable));\n+    assert(handSceneReadbackTarget(colors[0],extent,readable,&readbackDiagnostic));\n+    assert(readbackDiagnostic.find("checks=passed ")==0);\n     // A later LOAD pass has no clear or primary pipeline binds (the draws\n     // live in secondaries). It must retain the reversed prepass convention.\n     std::array<VkAttachmentDescription,2> loadAttachments{};\n'
