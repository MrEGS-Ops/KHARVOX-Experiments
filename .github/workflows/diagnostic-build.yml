name: KHARVOX Diagnostic Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Download reviewed baseline
        uses: actions/checkout@v4
        with:
          ref: 0cd5f291fb371d94cb17da32f49f8a7aa0e44623
          submodules: recursive
          lfs: true
          persist-credentials: false
      - name: Apply and verify diagnostic-only source change
        shell: python
        run: |
          from pathlib import Path
          import hashlib, subprocess
          p = Path('src/openxr/OpenXRBootstrap.cpp')
          original = p.read_text(encoding='utf-8')
          assert hashlib.sha256(original.encode()).hexdigest() == 'c8a6cff2a593b6457b564394ee231f0c34e261dc032a11c54da10b1fae21b79c', 'Source differs from reviewed baseline'
          p.write_text(original, encoding='utf-8', newline='\n')
          patch = 'diff --git a/src/openxr/OpenXRBootstrap.cpp b/src/openxr/OpenXRBootstrap.cpp\nindex b2fe89e..3228250 100644\n--- a/src/openxr/OpenXRBootstrap.cpp\n+++ b/src/openxr/OpenXRBootstrap.cpp\n@@ -164,6 +164,9 @@ struct State {\n     bool steamFramePrepared{}; XrFrameState steamPreparedFrame{XR_TYPE_FRAME_STATE}; XrResult steamPreparedWaitResult{XR_SUCCESS}; XrResult steamPreparedBeginResult{XR_SUCCESS}; double steamPreparedWaitMs{}; LARGE_INTEGER steamPreparedAt{}; DWORD steamPreparedThread{},steamPreparedAcquireCallerThread{}; VkSwapchainKHR steamPreparedDoomSwapchain{}; uint64_t steamPreparedFrames{},steamConsumedPreparedFrames{},steamRepeatedAcquires{}; bool steamFsrStartupHandshakeComplete{};\n     int renderEye{kharvox::aerFirstRenderEye}; std::array<VkImage,2> stereoCache{}; std::array<VkDeviceMemory,2> stereoCacheMemory{}; std::array<bool,2> stereoCacheInitialized{}; std::array<std::uint64_t,2> stereoCacheRevision{}; VkExtent2D stereoCacheExtent{}; bool alternatingStereo{}; bool alternatingStereoSkipInitialCapture{}; bool alternatingStereoWarmupActive{}; int alternatingStereoWarmupEye{}; unsigned alternatingStereoWarmupFramesRemaining{}; bool stereoStartupControllerMissing{}; unsigned long long stereoLevelGeneration{}; bool stereoLevelGenerationValid{}; unsigned long long stereoLevelGuardUntilTick{}; float worldScale{39.3701f}; float renderScale{1.f};\n     Fsr1Upscaler fsr1{}; bool fsr1Requested{}; bool fsr1InitializationAttempted{};\n+    bool upscalerProbeEnabled{};\n+    std::array<uint32_t,2> upscalerProbeSamples{};\n+    std::array<uint32_t,2> upscalerDepthProbeSamples{};\n     kharvox::hands::HandRenderer handRenderer{}; bool showHands{showHandsRequested()};\n     kharvox::hands::HandPose integratedPairLeftHand{},integratedPairRightHand{};\n     kharvox::hands::HandVisibilityOutput integratedPairHandVisibility{};\n@@ -2984,6 +2987,14 @@ bool createSwapchains() {\n         configuredRenderScale(), steamVrOwnsRenderScale&&!kharvox::native::requested());\n     const bool fsr1LauncherOption = GetFileAttributesW(\n         kharvox::runtimePath(L"enable_fsr_upscaling").c_str()) != INVALID_FILE_ATTRIBUTES;\n+    s.upscalerProbeEnabled = GetFileAttributesW(\n+        kharvox::runtimePath(L"enable_upscaler_probe").c_str()) != INVALID_FILE_ATTRIBUTES;\n+    s.upscalerProbeSamples = {};\n+    s.upscalerDepthProbeSamples = {};\n+    if(s.upscalerProbeEnabled)\n+        log("[UPSCALER-PROBE] enabled; probe=2 depth-association metadata; up to 120 samples per eye; "\n+            "diagnostics only, no temporal upscaler implemented; "\n+            "depth/motion/jitter availability not established by this probe", true);\n     const bool afwLauncherOption = false;\n     const float fsrSourceScale = s.renderScale;\n     s.fsr1Requested = kharvox::requestFsr1Upscaling(\n@@ -4759,6 +4770,38 @@ void KharvoxXRPresent(VkQueue q,const VkPresentInfoKHR*p,bool* consumedPresentWa\n                 }\n             }\n             ++s.stereoCacheRevision[e];\n+            // CPU metadata only. Do not dereference borrowed GPU resources or\n+            // treat a recorded attachment association as completed eye depth.\n+            if(s.upscalerProbeEnabled && !s.quadMode\n+                    && s.upscalerDepthProbeSamples[e]<120\n+                    && (s.upscalerDepthProbeSamples[e]<8 || s.stereoCacheRevision[e]%30==0)){\n+                kharvox::hands::HandSceneTarget sourceDepth{},cacheDepth{};\n+                const bool sourceCandidate=kharvox::hands::handSceneTargetForColor(\n+                    eyeSource,it->second.extent,sourceDepth);\n+                const bool cacheCandidate=kharvox::hands::handSceneTargetForColor(\n+                    cache,eyeSourceExtent,cacheDepth);\n+                std::ostringstream probe;\n+                probe<<"[UPSCALER-PROBE] depthObservation=1 eye="<<e\n+                    <<" sample="<<s.upscalerDepthProbeSamples[e]++\n+                    <<" xrFrame="<<s.frame<<" cacheRevision="<<s.stereoCacheRevision[e]\n+                    <<" nativeBackend="<<nativeBackend\n+                    <<" tracking="<<kharvox::hands::handSceneTrackingEnabled()\n+                    <<" sourceCandidate="<<sourceCandidate\n+                    <<" cacheCandidate="<<cacheCandidate\n+                    <<" sourceExtent="<<it->second.extent.width<<\'x\'<<it->second.extent.height\n+                    <<" copiedExtent="<<eyeSourceExtent.width<<\'x\'<<eyeSourceExtent.height\n+                    <<" depthFormat="<<sourceDepth.depthFormat\n+                    <<" depthLayout="<<sourceDepth.depthLayout\n+                    <<" depthSamples="<<sourceDepth.samples\n+                    <<" reverseDepth="<<sourceDepth.reverseDepth\n+                    <<" capturePoseValid="<<captureViewValid\n+                    <<" packed="<<nativePackedStereo\n+                    <<" nativeRightRequiresMirrorLookup="<<(nativeBackend&&e==1)\n+                    <<" temporalDepthValidated=0 motionVectorInput=unexposed jitterInput=unexposed"\n+                    <<" trackerDetails: "\n+                    <<kharvox::hands::handSceneTargetDiagnostic(eyeSource,it->second.extent);\n+                log(probe.str(),true);\n+            }\n             poseTraceCachedIds[e]=aerSourceQualified?aerSourceObservation.key.poseId:poseTraceProgrammedIds[e];\n             if(!nativePackedStereo&&captureViewValid)traceEye(kharvox::pose_trace::CacheRecorded,e,capturePose,eyeRenderProjection(captureFov).symmetricFov,frame.predictedDisplayTime,reinterpret_cast<uintptr_t>(src),s.stereoCacheRevision[e],0,poseTraceCachedIds[e]);\n             if(aerSourceQualified){s.aerSourceCacheKeys[e]=aerSourceObservation.key;s.aerSourceCacheValid[e]=true;}\n@@ -4959,6 +5002,31 @@ void KharvoxXRPresent(VkQueue q,const VkPresentInfoKHR*p,bool* consumedPresentWa\n         }\n \n         if(eyeCapture.requested)eyeCaptureCrop[e]={sourceX0,sourceY0,sourceX1,sourceY1};\n+        // Observe the exact source selected for the spatial upscaler. Revision\n+        // values describe the existing cache; they are not temporal histories.\n+        // Bound log I/O and leave image ownership and GPU commands untouched.\n+        if(s.upscalerProbeEnabled && stereoNow && !s.quadMode\n+                && s.upscalerProbeSamples[e]<120\n+                && (s.upscalerProbeSamples[e]<8 || s.frame%60==0)){\n+            std::ostringstream probe;\n+            probe<<"[UPSCALER-PROBE] eye="<<e\n+                <<" sample="<<s.upscalerProbeSamples[e]++\n+                <<" xrFrame="<<s.frame\n+                <<" stereo="<<stereoNow<<" quad="<<s.quadMode\n+                <<" nativeBackend="<<nativeBackend\n+                <<" nativeFrameValid="<<nativeFrameValid\n+                <<" packed="<<nativePackedStereo\n+                <<" freshWorldPair="<<useFreshWorldPair\n+                <<" cacheRevision="<<s.stereoCacheRevision[e]\n+                <<" worldRevision="<<s.freshHandsWorldRevision\n+                <<" worldPairRecorded="<<freshWorldPairRecorded\n+                <<" source="<<sourceWidth<<\'x\'<<sourceHeight\n+                <<" crop="<<sourceX0<<\',\'<<sourceY0<<\',\'<<sourceX1<<\',\'<<sourceY1\n+                <<" target="<<copyWidth<<\'x\'<<copyHeight\n+                <<" format="<<s.format\n+                <<" fsr1Active="<<s.fsr1.active();\n+            log(probe.str(),true);\n+        }\n         bool syntheticFsr1Source=false;\n         if(kharvox::useFsr1ForFrame(s.fsr1.active(),stereoNow,\n                 nativePackedStereo,s.quadMode,nativeBackend&&nativeFrameValid)){\n'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch.encode('utf-8'), check=True)
          subprocess.run(['git', 'apply', '-'], input=patch.encode('utf-8'), check=True)
          assert hashlib.sha256(p.read_text(encoding='utf-8').encode()).hexdigest() == 'ea339dd58377487338335bde22c59ff4181f7e80d476e2abecd39d2f860f353d', 'Patched source differs from reviewed probe'
      - name: Configure native build
        run: cmake -S . -B build/native -G "Visual Studio 17 2022" -A x64 -DKHARVOX_BUILD_LAYER=ON -DBUILD_TESTING=OFF
      - name: Compile renderer
        run: cmake --build build/native --config Release --target KharvoxLayer --parallel 2
      - name: Package separate-copy installer and probe
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, shutil, struct
          p = Path('probe-package')
          p.mkdir()
          dll = Path('build/native/Release/KharvoxLayer.dll')
          b = dll.read_bytes()
          assert b[:2] == b'MZ', 'Missing Windows DLL header'
          offset = struct.unpack_from('<I', b, 0x3c)[0]
          assert b[offset:offset+4] == b'PE\0\0' and struct.unpack_from('<H', b, offset+4)[0] == 0x8664, 'DLL must be Windows x64'
          shutil.copy2(dll, p / dll.name)
          payload = json.loads('{"Install-Probe.cmd": "@echo off\\npowershell.exe -NoProfile -ExecutionPolicy Bypass -File \\"%~dp0Install-Probe.ps1\\"\\n", "Install-Probe.ps1": "$ErrorActionPreference = \'Stop\'\\ntry {\\n    $source = (Read-Host \'Paste the folder containing your WORKING KharvoxLauncher.exe\').Trim().Trim(\'\\"\')\\n    $source = (Resolve-Path -LiteralPath $source).Path\\n    foreach ($name in @(\'KharvoxLauncher.exe\',\'KharvoxLayer.dll\',\'KharvoxLayer.json\',\'openxr_loader.dll\')) {\\n        if (!(Test-Path -LiteralPath (Join-Path $source $name) -PathType Leaf)) {\\n            throw \\"Missing $name in that folder. Select the working baseline Release folder.\\"\\n        }\\n    }\\n    $payload = Join-Path $PSScriptRoot \'KharvoxLayer.dll\'\\n    if (!(Test-Path -LiteralPath $payload)) { throw \'Download and extract the GitHub Actions artifact first. This source kit is not a compiled build.\' }\\n    $expected = (Get-Content -LiteralPath (Join-Path $PSScriptRoot \'LAYER-SHA256.txt\') -Raw).Trim()\\n    if ((Get-FileHash -LiteralPath $payload -Algorithm SHA256).Hash -ne $expected) { throw \'Diagnostic DLL checksum mismatch. Download the artifact again.\' }\\n    if ((Get-Item -LiteralPath (Join-Path $source \'KharvoxLayer.dll\')).VersionInfo.FileVersion -ne (Get-Item -LiteralPath $payload).VersionInfo.FileVersion) {\\n        throw \'Baseline and diagnostic DLL versions differ. Use the baseline build tested in this conversation.\'\\n    }\\n    $parent = Split-Path -Parent $source\\n    $destination = Join-Path $parent (\'KHARVOX-Probe-\' + (Get-Date -Format \'yyyyMMdd-HHmmss\') + \'-\' + [guid]::NewGuid().ToString(\'N\').Substring(0,6))\\n    if (Test-Path -LiteralPath $destination) { throw \'Destination already exists.\' }\\n    New-Item -ItemType Directory -Path $destination | Out-Null\\n    Get-ChildItem -LiteralPath $source -Force | Copy-Item -Destination $destination -Recurse -Force\\n    Copy-Item -LiteralPath $payload -Destination (Join-Path $destination \'KharvoxLayer.dll\') -Force\\n    foreach ($name in @(\'Collect-Probe.cmd\',\'Collect-Probe.ps1\',\'TESTING.txt\',\'BUILD-INFO.txt\')) {\\n        Copy-Item -LiteralPath (Join-Path $PSScriptRoot $name) -Destination $destination\\n    }\\n    New-Item -ItemType File -Path (Join-Path $destination \'enable_upscaler_probe\') -Force | Out-Null\\n    Write-Host \\"Installed into a separate copy: $destination\\"\\n    Write-Host \'Open that folder and run KharvoxLauncher.exe. Your original folder is unchanged.\'\\n    Start-Process explorer.exe -ArgumentList (\'\\"\' + $destination + \'\\"\')\\n} catch {\\n    Write-Host \\"INSTALL FAILED: $($_.Exception.Message)\\" -ForegroundColor Red\\n    Read-Host \'Press Enter to close\'\\n    exit 1\\n}\\nRead-Host \'Press Enter to close\'\\n", "Collect-Probe.cmd": "@echo off\\npowershell.exe -NoProfile -ExecutionPolicy Bypass -File \\"%~dp0Collect-Probe.ps1\\"\\n", "Collect-Probe.ps1": "$ErrorActionPreference = \'Stop\'\\ntry {\\n    $log = Join-Path $env:TEMP \'KHARVOX.log\'\\n    if (!(Test-Path -LiteralPath $log)) { throw \'No KHARVOX.log found. Run the diagnostic copy first.\' }\\n    $lines = @(Get-Content -LiteralPath $log | Where-Object { $_.Contains(\'[UPSCALER-PROBE]\') })\\n    $start = -1\\n    for ($i=0; $i -lt $lines.Count; $i++) {\\n        if ($lines[$i].Contains(\'[UPSCALER-PROBE] enabled;\')) { $start = $i }\\n    }\\n    if ($start -lt 0) { throw \'No diagnostic session found. Check that you launched the separate diagnostic folder.\' }\\n    $latest = @($lines[$start..($lines.Count-1)])\\n    if (!($latest | Where-Object { $_.Contains(\' eye=\') })) {\\n        Write-Warning \'The probe started but recorded no stereo frames. Include this result and describe what happened.\'\\n    }\\n    $destination = Join-Path $PSScriptRoot (\'KHARVOX-Probe-Results-\' + (Get-Date -Format \'yyyyMMdd-HHmmss\') + \'.txt\')\\n    @(\'KHARVOX depth-association probe; no temporal upscaler implemented.\', (\'Collected: \' + (Get-Date -Format o))) +\\n        @(Get-Content -LiteralPath (Join-Path $PSScriptRoot \'BUILD-INFO.txt\')) + $latest |\\n        Set-Content -LiteralPath $destination -Encoding UTF8\\n    Write-Host \\"Upload this file in the chat: $destination\\"\\n} catch {\\n    Write-Host \\"COLLECTION FAILED: $($_.Exception.Message)\\" -ForegroundColor Red\\n    Read-Host \'Press Enter to close\'\\n    exit 1\\n}\\nRead-Host \'Press Enter to close\'\\n", "TESTING.txt": "KHARVOX DEPTH-ASSOCIATION PROBE 2\\n\\nPurpose: observe tracked source-depth and cached-colour depth associations\\nwhen each eye\'s colour is copied, plus dimensions and cache revisions.\\nOnly CPU metadata is queried. Rendering is unchanged. This does NOT implement\\nFSR2, DLSS, optical flow, frame generation or temporal reconstruction. It does\\nnot establish correct depth contents, motion vectors, jitter or temporal history.\\nThe native right-eye mirror is not resolved by this probe; a failed direct\\nlookup for it does not establish that native right-eye depth is unavailable.\\n\\nINSTALL THE COMPILED ACTIONS ARTIFACT\\n1. Extract the KHARVOX-Probe-Windows artifact completely.\\n2. Double-click Install-Probe.cmd.\\n3. Paste the folder containing the baseline KharvoxLauncher.exe you tested.\\n4. The installer copies that entire folder to a new sibling folder and replaces\\n   only the copy\'s renderer DLL. It opens that folder. No administrator needed.\\n   This inherits your baseline\'s accessories and dependencies; it does not add\\n   a missing bHaptics SDK or install drivers.\\n\\nTEST\\n1. Close any other KHARVOX/DOOM session.\\n2. Run KharvoxLauncher.exe FROM THE NEW KHARVOX-Probe folder.\\n3. Connect Quest 3 with your usual Virtual Desktop/VDXR configuration.\\n4. Use AER as in your first test. Keep your known working render scale and other\\n   settings. Keep KHARVOX\'s hands enabled: its existing depth tracker requires\\n   the hands option. If disabled, the probe reports tracking=0 rather than\\n   silently turning any rendering option on.\\n5. Load a level and play for about 60 seconds: stand still, turn your head,\\n   walk, and observe a moving enemy. No particular performance gain is expected.\\n6. Close the game, then double-click Collect-Probe.cmd in the NEW folder.\\n7. Upload the generated KHARVOX-Probe-Results-*.txt here. Tell me your renderer\\n   mode (AER or Native), render scale, FSR1 setting, and whether visuals changed.\\n8. One AER run is sufficient for this test. No native-mode test is requested.\\n\\nThe collector exports only probe lines from the latest marked session plus\\nbuild metadata, not your complete runtime log. Source-frame samples are limited\\nto the first 8 observations and then every 60 XR frames. Depth metadata is\\nsampled for the first 8 eye colour copies, then every 30 cache revisions.\\nEach observation type is capped at 120 records per eye.\\nMenu/flat-screen frames are excluded. Logging can still cause some overhead.\\n\\nROLLBACK\\nClose the diagnostic game and launch your original baseline folder. Delete the\\nseparate diagnostic folder when finished. No original files were replaced.\\n\\nSTATUS\\nThis package requires GitHub\'s Windows build to succeed before it contains a\\nDLL. Local preparation does not prove Windows compilation or VR compatibility.\\nHeadset validation is the purpose of this test. Three upscaler variants remain\\nunimplemented; this is a prerequisite investigation, not those deliverables.\\n"}')
          for name, content in payload.items():
              (p / name).write_text(content, encoding='utf-8', newline='\r\n')
          (p / 'LAYER-SHA256.txt').write_text(hashlib.sha256(b).hexdigest() + '\n')
          (p / 'BUILD-INFO.txt').write_text('Probe: depth-association-observer-2\nBaseline commit: 0cd5f291fb371d94cb17da32f49f8a7aa0e44623\nPatched source SHA256: ea339dd58377487338335bde22c59ff4181f7e80d476e2abecd39d2f860f353d\nTemporal backends: none\n')
          shutil.copy2('LICENSE.txt', p / 'LICENSE.txt')
          shutil.copy2('Docs/THIRD_PARTY_NOTICES.txt', p / 'THIRD_PARTY_NOTICES.txt')
      - name: Save diagnostic test kit
        uses: actions/upload-artifact@v4
        with:
          name: KHARVOX-Probe-Windows
          retention-days: 14
          if-no-files-found: error
          path: probe-package/
