name: KHARVOX Diagnostic Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Download reviewed baseline
        uses: actions/checkout@v4
        with:
          ref: 0cd5f291fb371d94cb17da32f49f8a7aa0e44623
          submodules: recursive
          lfs: true
          persist-credentials: false
      - name: Apply and verify diagnostic-only source change
        shell: python
        run: |
          from pathlib import Path
          import hashlib, subprocess, json
          before_hashes = {'src/openxr/OpenXRBootstrap.cpp': 'c8a6cff2a593b6457b564394ee231f0c34e261dc032a11c54da10b1fae21b79c', 'src/hands/HandSceneDepthTracker.cpp': '19b0415ba14fd86f65fb2c2b3c8486ec3fa12b828eecd98c64def42c84d87fbc', 'src/hands/HandSceneDepthTracker.h': '4d28553326dcbc85c3ac61bcb968bff09bfac9d5f47ddcde3a55764d3dfde9fe', 'tests/hand_scene_depth_tracker_tests.cpp': '84da7d4831d75c46940b6e0af6a9727ae72581fa32e1a8ef98dc129ae508fa78'}
          after_hashes = {'src/openxr/OpenXRBootstrap.cpp': 'a78356c634aea7e43be191e9a0a77657f38ea61a7cd5019ce7ab2b26ae37e8f5', 'src/hands/HandSceneDepthTracker.cpp': 'd07dd28eac9e7912900e3f3740254aec370cbeab847d19f3e777dcff6e73b7ea', 'src/hands/HandSceneDepthTracker.h': '856ffe377a1c43e40dececdf7d6be98c3583e5fda41101c5ec8e96bf796456ae', 'tests/hand_scene_depth_tracker_tests.cpp': '2a091a27517e8296d1f17feaa0fc70682ec82bdd0d596f3333cef9e28f655ab1', 'src/openxr/DepthProbe.inc': '0e29e616a179ef930336d579d0a3a45e1b66a56d9204cc37c85407b6bf83c4b6'}
          new_files = json.loads('{"src/openxr/DepthProbe.inc": "// One-shot AER colour/depth readback. Included after EyeCapture.inc.\\n// Host access only occurs after the owner\'s successful GPU completion wait.\\nstruct DepthProbeCapture {\\n    VkBuffer buffer{}; VkDeviceMemory memory{}; void* mapped{};\\n    VkExtent2D extent{}; VkFormat colourFormat{},depthFormat{};\\n    VkDeviceSize planeBytes{};\\n    uint64_t frame{},revision{};\\n    bool pending{},attempted{},reverseDepth{};\\n};\\nstd::array<DepthProbeCapture,2> depthProbeCaptures{};\\nuint64_t depthProbeDue{};\\nstd::filesystem::path depthProbeDirectory;\\n\\nvoid releaseDepthProbe(DepthProbeCapture& c){\\n    // Call only before submission or after proven completion.\\n    if(c.mapped)s.vk.unmapMemory(s.device,c.memory);\\n    if(c.buffer)s.vk.destroyBuffer(s.device,c.buffer,nullptr);\\n    if(c.memory)s.vk.freeMemory(s.device,c.memory,nullptr);\\n    c.mapped=nullptr;c.buffer={};c.memory={};c.pending=false;\\n}\\n\\nbool recordDepthProbe(int eye,VkImage colour,VkExtent2D extent,VkFormat format,\\n                      uint64_t revision,kharvox::GameImageLifetime::Use& lifetime){\\n    if(!s.upscalerProbeEnabled||!kharvox::runtimeFileExists(L\\"enable_depth_readback\\"))return false;\\n    auto& c=depthProbeCaptures[eye];\\n    if(c.attempted)return false;\\n    if(!depthProbeDue){depthProbeDue=GetTickCount64()+20000;log(\\"[UPSCALER-PROBE] capture armed; depth/colour screenshots due in 20 seconds\\",true);}\\n    if(GetTickCount64()<depthProbeDue)return false;\\n    c.attempted=true;\\n    auto reject=[&](const char* reason){log(\\"[UPSCALER-PROBE] captureSkipped eye=\\"+std::to_string(eye)+\\" reason=\\"+reason,true);return false;};\\n    if(format!=VK_FORMAT_B8G8R8A8_UNORM&&format!=VK_FORMAT_B8G8R8A8_SRGB\\n        &&format!=VK_FORMAT_R8G8B8A8_UNORM&&format!=VK_FORMAT_R8G8B8A8_SRGB)return reject(\\"colour-format\\");\\n    kharvox::hands::HandSceneTarget t{};\\n    if(!lifetime.select([&]{return kharvox::hands::handSceneReadbackTarget(colour,extent,t);},[&]{\\n        return std::array{kharvox::GameImageLifetime::key(t.colorImage),kharvox::GameImageLifetime::key(t.depthImage),\\n            kharvox::GameImageLifetime::key(t.colorView),kharvox::GameImageLifetime::key(t.depthView)};\\n    }))return reject(\\"no-copyable-depth-target-or-lifetime-unavailable\\");\\n    if(t.depthFormat!=VK_FORMAT_D24_UNORM_S8_UINT&&t.depthFormat!=VK_FORMAT_X8_D24_UNORM_PACK32\\n        &&t.depthFormat!=VK_FORMAT_D32_SFLOAT&&t.depthFormat!=VK_FORMAT_D32_SFLOAT_S8_UINT)return reject(\\"depth-format\\");\\n    auto copy=reinterpret_cast<PFN_vkCmdCopyImageToBuffer>(s.vk.getDeviceProcAddr(s.device,\\"vkCmdCopyImageToBuffer\\"));\\n    if(!copy||!s.vk.createBuffer||!s.vk.destroyBuffer||!s.vk.getBufferMemoryRequirements\\n        ||!s.vk.allocateMemory||!s.vk.freeMemory||!s.vk.bindBufferMemory\\n        ||!s.vk.mapMemory||!s.vk.unmapMemory||!s.vk.getPhysicalDeviceMemoryProperties)return reject(\\"dispatch\\");\\n    c.planeBytes=VkDeviceSize(extent.width)*extent.height*4;\\n    if(!c.planeBytes||c.planeBytes>128ull*1024*1024)return reject(\\"size-budget\\");\\n    auto failed=[&]{releaseDepthProbe(c);return reject(\\"allocation\\");};\\n    VkBufferCreateInfo bi{VK_STRUCTURE_TYPE_BUFFER_CREATE_INFO};bi.size=c.planeBytes*2;bi.usage=VK_BUFFER_USAGE_TRANSFER_DST_BIT;\\n    if(s.vk.createBuffer(s.device,&bi,nullptr,&c.buffer)!=VK_SUCCESS)return failed();\\n    VkMemoryRequirements req{};s.vk.getBufferMemoryRequirements(s.device,c.buffer,&req);\\n    VkPhysicalDeviceMemoryProperties props{};s.vk.getPhysicalDeviceMemoryProperties(s.physical,&props);\\n    uint32_t type=UINT32_MAX;\\n    for(uint32_t i=0;i<props.memoryTypeCount;++i)if((req.memoryTypeBits&(1u<<i))\\n        &&(props.memoryTypes[i].propertyFlags&(VK_MEMORY_PROPERTY_HOST_VISIBLE_BIT|VK_MEMORY_PROPERTY_HOST_COHERENT_BIT))\\n        ==(VK_MEMORY_PROPERTY_HOST_VISIBLE_BIT|VK_MEMORY_PROPERTY_HOST_COHERENT_BIT)){type=i;break;}\\n    if(type==UINT32_MAX)return failed();\\n    VkMemoryAllocateInfo ai{VK_STRUCTURE_TYPE_MEMORY_ALLOCATE_INFO};ai.allocationSize=req.size;ai.memoryTypeIndex=type;\\n    if(s.vk.allocateMemory(s.device,&ai,nullptr,&c.memory)!=VK_SUCCESS\\n        ||s.vk.bindBufferMemory(s.device,c.buffer,c.memory,0)!=VK_SUCCESS\\n        ||s.vk.mapMemory(s.device,c.memory,0,VK_WHOLE_SIZE,0,&c.mapped)!=VK_SUCCESS)return failed();\\n    c.extent=extent;c.colourFormat=format;c.depthFormat=t.depthFormat;\\n    c.frame=s.frame;c.revision=revision;c.reverseDepth=t.reverseDepth;\\n    // Colour is already TRANSFER_SRC at the cache-copy point.\\n    VkBufferImageCopy region{};region.imageSubresource={VK_IMAGE_ASPECT_COLOR_BIT,0,0,1};region.imageExtent={extent.width,extent.height,1};\\n    copy(s.commandBuffer,colour,VK_IMAGE_LAYOUT_TRANSFER_SRC_OPTIMAL,c.buffer,1,&region);\\n    const auto aspects=kharvox::hands::handSceneDepthAspect(t.depthFormat);\\n    barrierAspect(s.commandBuffer,t.depthImage,t.depthLayout,VK_IMAGE_LAYOUT_TRANSFER_SRC_OPTIMAL,\\n        VK_ACCESS_MEMORY_READ_BIT|VK_ACCESS_MEMORY_WRITE_BIT,VK_ACCESS_TRANSFER_READ_BIT,aspects);\\n    region.bufferOffset=c.planeBytes;region.imageSubresource.aspectMask=VK_IMAGE_ASPECT_DEPTH_BIT;\\n    copy(s.commandBuffer,t.depthImage,VK_IMAGE_LAYOUT_TRANSFER_SRC_OPTIMAL,c.buffer,1,&region);\\n    barrierAspect(s.commandBuffer,t.depthImage,VK_IMAGE_LAYOUT_TRANSFER_SRC_OPTIMAL,t.depthLayout,\\n        VK_ACCESS_TRANSFER_READ_BIT,VK_ACCESS_MEMORY_READ_BIT|VK_ACCESS_MEMORY_WRITE_BIT,aspects);\\n    VkMemoryBarrier host{VK_STRUCTURE_TYPE_MEMORY_BARRIER};host.srcAccessMask=VK_ACCESS_TRANSFER_WRITE_BIT;host.dstAccessMask=VK_ACCESS_HOST_READ_BIT;\\n    s.vk.cmdPipelineBarrier(s.commandBuffer,VK_PIPELINE_STAGE_TRANSFER_BIT,VK_PIPELINE_STAGE_HOST_BIT,0,1,&host,0,nullptr,0,nullptr);\\n    c.pending=true;\\n    return true;\\n}\\n\\nvoid finishDepthProbe(int eye){\\n    auto& c=depthProbeCaptures[eye];if(!c.pending)return;\\n    const HRESULT com=CoInitializeEx(nullptr,COINIT_MULTITHREADED);\\n    try{\\n        if(depthProbeDirectory.empty()){\\n            wchar_t temp[MAX_PATH]{};if(!GetTempPathW(MAX_PATH,temp))throw std::runtime_error(\\"temp path unavailable\\");\\n            depthProbeDirectory=std::filesystem::path(temp)/L\\"KHARVOX-DepthCaptures\\"/\\n                (std::to_wstring(GetCurrentProcessId())+L\\"-\\"+std::to_wstring(GetTickCount64()));\\n            std::filesystem::create_directories(depthProbeDirectory);\\n        }\\n        const std::string prefix=eye?\\"right\\":\\"left\\";\\n        std::vector<BYTE> pixels(static_cast<size_t>(c.planeBytes));\\n        std::memcpy(pixels.data(),c.mapped,pixels.size());\\n        const bool rgba=c.colourFormat==VK_FORMAT_R8G8B8A8_UNORM||c.colourFormat==VK_FORMAT_R8G8B8A8_SRGB;\\n        for(size_t i=0;i<pixels.size();i+=4){if(rgba)std::swap(pixels[i],pixels[i+2]);pixels[i+3]=255;}\\n        bool saved=kharvox::writeEyePng(depthProbeDirectory/(prefix+\\"-colour.png\\"),c.extent.width,c.extent.height,pixels.data());\\n        const BYTE* depth=static_cast<const BYTE*>(c.mapped)+c.planeBytes;\\n        double minimum=1,maximum=0;size_t invalid=0;\\n        for(size_t i=0;i<pixels.size();i+=4){\\n            double d{};\\n            if(c.depthFormat==VK_FORMAT_D24_UNORM_S8_UINT||c.depthFormat==VK_FORMAT_X8_D24_UNORM_PACK32){\\n                uint32_t packed{};std::memcpy(&packed,depth+i,4);d=double(packed&0x00ffffffu)/16777215.0;\\n            }else{float v{};std::memcpy(&v,depth+i,4);d=v;}\\n            if(!std::isfinite(d)||d<0||d>1){++invalid;pixels[i]=255;pixels[i+1]=0;pixels[i+2]=255;}\\n            else{\\n                minimum=std::min(minimum,d);maximum=std::max(maximum,d);\\n                // Contrast-enhanced device depth, not metric/linear distance.\\n                const double nearValue=c.reverseDepth?d:1-d;\\n                const BYTE value=static_cast<BYTE>(std::lround(255*std::log1p(65535*nearValue)/std::log(65536.0)));\\n                pixels[i]=pixels[i+1]=pixels[i+2]=value;\\n            }\\n            pixels[i+3]=255;\\n        }\\n        saved=kharvox::writeEyePng(depthProbeDirectory/(prefix+\\"-depth.png\\"),c.extent.width,c.extent.height,pixels.data())&&saved;\\n        std::ofstream meta(depthProbeDirectory/(prefix+\\"-metadata.txt\\"));\\n        meta<<\\"Probe 3: AER snapshot readback, not a temporal depth cache\\\\neye=\\"<<eye<<\\"\\\\nframe=\\"<<c.frame\\n            <<\\"\\\\ncacheRevision=\\"<<c.revision<<\\"\\\\nwidth=\\"<<c.extent.width<<\\"\\\\nheight=\\"<<c.extent.height\\n            <<\\"\\\\ndepthFormat=\\"<<c.depthFormat<<\\"\\\\nreverseDepth=\\"<<c.reverseDepth<<\\"\\\\nmin=\\"<<minimum<<\\"\\\\nmax=\\"<<maximum\\n            <<\\"\\\\ninvalidPixels=\\"<<invalid<<\\"\\\\nGPU completion verified. Same submission colour/depth; content alignment unverified.\\"\\n            <<\\"\\\\nSeparate eyes are captured on separate AER frames. White=near, black=far; logarithmic device-depth contrast.\\\\n\\";\\n        meta.close();\\n        log(\\"[UPSCALER-PROBE] captureSaved=\\"+std::to_string(saved&&bool(meta))+\\" eye=\\"+std::to_string(eye)\\n            +\\" directory=\\"+depthProbeDirectory.string(),true);\\n    }catch(const std::exception& ex){log(std::string(\\"[UPSCALER-PROBE] capture write failed: \\")+ex.what(),true);}\\n    if(SUCCEEDED(com))CoUninitialize();\\n    releaseDepthProbe(c);\\n}\\n"}')
          for name, expected in before_hashes.items():
              p = Path(name)
              original = p.read_text(encoding='utf-8')
              assert hashlib.sha256(original.encode()).hexdigest() == expected, 'Source differs from reviewed baseline: ' + name
              p.write_text(original, encoding='utf-8', newline='\n')
          for name in new_files:
              assert not Path(name).exists(), 'New probe source already exists: ' + name
          patch = 'diff --git a/src/hands/HandSceneDepthTracker.cpp b/src/hands/HandSceneDepthTracker.cpp\nindex fa53509..8d5c399 100644\n--- a/src/hands/HandSceneDepthTracker.cpp\n+++ b/src/hands/HandSceneDepthTracker.cpp\n@@ -20,11 +20,13 @@ struct ImageInfo {\n     VkFormat format{VK_FORMAT_UNDEFINED};\n     VkImageUsageFlags usage{};\n     VkSampleCountFlagBits samples{VK_SAMPLE_COUNT_1_BIT};\n+    bool simpleReadback{};\n };\n struct ViewInfo {\n     VkImage image{};\n     VkFormat format{VK_FORMAT_UNDEFINED};\n     VkImageAspectFlags aspects{};\n+    bool baseSubresource{};\n };\n struct FramebufferInfo {\n     VkRenderPass renderPass{};\n@@ -117,7 +119,9 @@ void handSceneImageCreated(VkImage image, const VkImageCreateInfo& info) {\n         return;\n     std::lock_guard<std::mutex> lock(trackerMutex);\n     images[handleKey(image)] = {info.extent, info.format, info.usage,\n-                                info.samples};\n+                                info.samples, info.imageType==VK_IMAGE_TYPE_2D\n+                                &&info.mipLevels==1&&info.arrayLayers==1\n+                                &&!(info.flags&(VK_IMAGE_CREATE_PROTECTED_BIT|VK_IMAGE_CREATE_SPARSE_BINDING_BIT))};\n     depthConventions.erase(handleKey(image));\n }\n \n@@ -157,7 +161,10 @@ void handSceneImageViewCreated(VkImageView view,\n         return;\n     std::lock_guard<std::mutex> lock(trackerMutex);\n     views[handleKey(view)] = {info.image, info.format,\n-                              info.subresourceRange.aspectMask};\n+                              info.subresourceRange.aspectMask,\n+                              info.subresourceRange.baseMipLevel==0\n+                              &&info.subresourceRange.baseArrayLayer==0\n+                              &&(info.subresourceRange.layerCount==1||info.subresourceRange.layerCount==VK_REMAINING_ARRAY_LAYERS)};\n }\n \n void handSceneImageViewDestroyed(VkImageView view) {\n@@ -414,6 +421,25 @@ bool handSceneTargetForColor(VkImage colorImage, VkExtent2D requiredExtent,\n     return true;\n }\n \n+bool handSceneReadbackTarget(VkImage colorImage,VkExtent2D extent,HandSceneTarget& result) {\n+    result={};\n+    if(!handSceneTrackingEnabled()||!colorImage)return false;\n+    std::lock_guard<std::mutex> lock(trackerMutex);\n+    const auto t=targets.find(handleKey(colorImage));\n+    if(t==targets.end())return false;\n+    const auto& target=t->second;\n+    const auto image=images.find(handleKey(target.depthImage));\n+    const auto view=views.find(handleKey(target.depthView));\n+    if(image==images.end()||view==views.end()||!image->second.simpleReadback\n+        ||!view->second.baseSubresource||!(image->second.usage&VK_IMAGE_USAGE_TRANSFER_SRC_BIT)\n+        ||image->second.samples!=VK_SAMPLE_COUNT_1_BIT\n+        ||target.depthLayout==VK_IMAGE_LAYOUT_UNDEFINED\n+        ||target.extent.width!=extent.width||target.extent.height!=extent.height\n+        ||image->second.extent.width!=extent.width||image->second.extent.height!=extent.height\n+        ||image->second.format!=target.depthFormat)return false;\n+    result=target;return true;\n+}\n+\n void handSceneDeviceDestroyed() {\n     if (!handSceneTrackingEnabled())\n         return;\ndiff --git a/src/hands/HandSceneDepthTracker.h b/src/hands/HandSceneDepthTracker.h\nindex 9b597a6..431b94c 100644\n--- a/src/hands/HandSceneDepthTracker.h\n+++ b/src/hands/HandSceneDepthTracker.h\n@@ -57,6 +57,10 @@ void handSceneEndRenderPass(VkCommandBuffer commandBuffer);\n \n bool handSceneTargetForColor(VkImage colorImage, VkExtent2D requiredExtent,\n                              HandSceneTarget& target);\n+// Readback-only lookup: requires single-layer/mip 2D transfer-source depth\n+// and a view selecting mip/layer zero. Caller must retain resource lifetime.\n+bool handSceneReadbackTarget(VkImage colorImage, VkExtent2D requiredExtent,\n+                             HandSceneTarget& target);\n std::string handSceneTargetDiagnostic(VkImage colorImage,\n                                       VkExtent2D requiredExtent);\n void handSceneDeviceDestroyed();\ndiff --git a/src/openxr/OpenXRBootstrap.cpp b/src/openxr/OpenXRBootstrap.cpp\nindex b2fe89e..bf039a0 100644\n--- a/src/openxr/OpenXRBootstrap.cpp\n+++ b/src/openxr/OpenXRBootstrap.cpp\n@@ -164,6 +164,9 @@ struct State {\n     bool steamFramePrepared{}; XrFrameState steamPreparedFrame{XR_TYPE_FRAME_STATE}; XrResult steamPreparedWaitResult{XR_SUCCESS}; XrResult steamPreparedBeginResult{XR_SUCCESS}; double steamPreparedWaitMs{}; LARGE_INTEGER steamPreparedAt{}; DWORD steamPreparedThread{},steamPreparedAcquireCallerThread{}; VkSwapchainKHR steamPreparedDoomSwapchain{}; uint64_t steamPreparedFrames{},steamConsumedPreparedFrames{},steamRepeatedAcquires{}; bool steamFsrStartupHandshakeComplete{};\n     int renderEye{kharvox::aerFirstRenderEye}; std::array<VkImage,2> stereoCache{}; std::array<VkDeviceMemory,2> stereoCacheMemory{}; std::array<bool,2> stereoCacheInitialized{}; std::array<std::uint64_t,2> stereoCacheRevision{}; VkExtent2D stereoCacheExtent{}; bool alternatingStereo{}; bool alternatingStereoSkipInitialCapture{}; bool alternatingStereoWarmupActive{}; int alternatingStereoWarmupEye{}; unsigned alternatingStereoWarmupFramesRemaining{}; bool stereoStartupControllerMissing{}; unsigned long long stereoLevelGeneration{}; bool stereoLevelGenerationValid{}; unsigned long long stereoLevelGuardUntilTick{}; float worldScale{39.3701f}; float renderScale{1.f};\n     Fsr1Upscaler fsr1{}; bool fsr1Requested{}; bool fsr1InitializationAttempted{};\n+    bool upscalerProbeEnabled{};\n+    std::array<uint32_t,2> upscalerProbeSamples{};\n+    std::array<uint32_t,2> upscalerDepthProbeSamples{};\n     kharvox::hands::HandRenderer handRenderer{}; bool showHands{showHandsRequested()};\n     kharvox::hands::HandPose integratedPairLeftHand{},integratedPairRightHand{};\n     kharvox::hands::HandVisibilityOutput integratedPairHandVisibility{};\n@@ -2984,6 +2987,14 @@ bool createSwapchains() {\n         configuredRenderScale(), steamVrOwnsRenderScale&&!kharvox::native::requested());\n     const bool fsr1LauncherOption = GetFileAttributesW(\n         kharvox::runtimePath(L"enable_fsr_upscaling").c_str()) != INVALID_FILE_ATTRIBUTES;\n+    s.upscalerProbeEnabled = GetFileAttributesW(\n+        kharvox::runtimePath(L"enable_upscaler_probe").c_str()) != INVALID_FILE_ATTRIBUTES;\n+    s.upscalerProbeSamples = {};\n+    s.upscalerDepthProbeSamples = {};\n+    if(s.upscalerProbeEnabled)\n+        log("[UPSCALER-PROBE] enabled; probe=3 colour-depth snapshot readback; up to 120 metadata samples per eye; "\n+            "diagnostics only, no temporal upscaler implemented; "\n+            "depth/motion/jitter availability not established by this probe", true);\n     const bool afwLauncherOption = false;\n     const float fsrSourceScale = s.renderScale;\n     s.fsr1Requested = kharvox::requestFsr1Upscaling(\n@@ -3229,6 +3240,7 @@ void invalidateAlternatingStereoHistory(bool clearProgrammedViews){\n     if(clearProgrammedViews)s.programmedEyeViewValid={};\n }\n #include "EyeCapture.inc"\n+#include "DepthProbe.inc"\n #include "FreshAerHandsCache.inc"\n \n std::array<uint64_t,2> poseTracePublishedRevisions{};\n@@ -4716,6 +4728,7 @@ void KharvoxXRPresent(VkQueue q,const VkPresentInfoKHR*p,bool* consumedPresentWa\n             VK_ACCESS_MEMORY_WRITE_BIT|VK_ACCESS_COLOR_ATTACHMENT_WRITE_BIT,VK_ACCESS_TRANSFER_READ_BIT);\n     }\n     std::array<bool,2> integratedNativeHands{};\n+    std::array<bool,2> depthProbeRecorded{};\n     std::array<VkImage,2> copySources{src,src};\n     if(stereoNow&&!skipAlternatingCapture){\n         const int first=nativePackedStereo?0:currentRenderEye;\n@@ -4744,6 +4757,8 @@ void KharvoxXRPresent(VkQueue q,const VkPresentInfoKHR*p,bool* consumedPresentWa\n                 }else if(e==1)barrier(s.commandBuffer,eyeSource,nativeFrame.eyes[e].layout,VK_IMAGE_LAYOUT_TRANSFER_SRC_OPTIMAL,VK_ACCESS_MEMORY_WRITE_BIT,VK_ACCESS_TRANSFER_READ_BIT);\n