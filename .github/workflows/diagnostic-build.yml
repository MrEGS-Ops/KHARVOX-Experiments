heRevision="<<s.stereoCacheRevision[e]\n+                    <<" nativeBackend="<<nativeBackend\n+                    <<" tracking="<<kharvox::hands::handSceneTrackingEnabled()\n+                    <<" sourceCandidate="<<sourceCandidate\n+                    <<" cacheCandidate="<<cacheCandidate\n+                    <<" sourceExtent="<<it->second.extent.width<<\'x\'<<it->second.extent.height\n+                    <<" copiedExtent="<<eyeSourceExtent.width<<\'x\'<<eyeSourceExtent.height\n+                    <<" depthFormat="<<sourceDepth.depthFormat\n+                    <<" depthLayout="<<sourceDepth.depthLayout\n+                    <<" depthSamples="<<sourceDepth.samples\n+                    <<" reverseDepth="<<sourceDepth.reverseDepth\n+                    <<" capturePoseValid="<<captureViewValid\n+                    <<" packed="<<nativePackedStereo\n+                    <<" nativeRightRequiresMirrorLookup="<<(nativeBackend&&e==1)\n+                    <<" temporalDepthValidated=0 motionVectorInput=unexposed jitterInput=unexposed"\n+                    <<" trackerDetails: "\n+                    <<kharvox::hands::handSceneTargetDiagnostic(eyeSource,it->second.extent);\n+                log(probe.str(),true);\n+            }\n             poseTraceCachedIds[e]=aerSourceQualified?aerSourceObservation.key.poseId:poseTraceProgrammedIds[e];\n             if(!nativePackedStereo&&captureViewValid)traceEye(kharvox::pose_trace::CacheRecorded,e,capturePose,eyeRenderProjection(captureFov).symmetricFov,frame.predictedDisplayTime,reinterpret_cast<uintptr_t>(src),s.stereoCacheRevision[e],0,poseTraceCachedIds[e]);\n             if(aerSourceQualified){s.aerSourceCacheKeys[e]=aerSourceObservation.key;s.aerSourceCacheValid[e]=true;}\n@@ -4959,6 +5006,31 @@ void KharvoxXRPresent(VkQueue q,const VkPresentInfoKHR*p,bool* consumedPresentWa\n         }\n \n         if(eyeCapture.requested)eyeCaptureCrop[e]={sourceX0,sourceY0,sourceX1,sourceY1};\n+        // Observe the exact source selected for the spatial upscaler. Revision\n+        // values describe the existing cache; they are not temporal histories.\n+        // Bound log I/O and leave image ownership and GPU commands untouched.\n+        if(s.upscalerProbeEnabled && stereoNow && !s.quadMode\n+                && s.upscalerProbeSamples[e]<120\n+                && (s.upscalerProbeSamples[e]<8 || s.frame%60==0)){\n+            std::ostringstream probe;\n+            probe<<"[UPSCALER-PROBE] eye="<<e\n+                <<" sample="<<s.upscalerProbeSamples[e]++\n+                <<" xrFrame="<<s.frame\n+                <<" stereo="<<stereoNow<<" quad="<<s.quadMode\n+                <<" nativeBackend="<<nativeBackend\n+                <<" nativeFrameValid="<<nativeFrameValid\n+                <<" packed="<<nativePackedStereo\n+                <<" freshWorldPair="<<useFreshWorldPair\n+                <<" cacheRevision="<<s.stereoCacheRevision[e]\n+                <<" worldRevision="<<s.freshHandsWorldRevision\n+                <<" worldPairRecorded="<<freshWorldPairRecorded\n+                <<" source="<<sourceWidth<<\'x\'<<sourceHeight\n+                <<" crop="<<sourceX0<<\',\'<<sourceY0<<\',\'<<sourceX1<<\',\'<<sourceY1\n+                <<" target="<<copyWidth<<\'x\'<<copyHeight\n+                <<" format="<<s.format\n+                <<" fsr1Active="<<s.fsr1.active();\n+            log(probe.str(),true);\n+        }\n         bool syntheticFsr1Source=false;\n         if(kharvox::useFsr1ForFrame(s.fsr1.active(),stereoNow,\n                 nativePackedStereo,s.quadMode,nativeBackend&&nativeFrameValid)){\n@@ -5108,7 +5180,8 @@ void KharvoxXRPresent(VkQueue q,const VkPresentInfoKHR*p,bool* consumedPresentWa\n     const bool nativePairReady=nativeFrameValid&&updateEyeSwapchains&&eyeImageAcquired[0]&&eyeImageAcquired[1];\n     const bool queueSynchronized=queueAccessLockCallback&&queueAccessUnlockCallback;\n     const bool readbackRecorded=nativeXrCaptureRecorded||nativeWatchRecorded||eyeCaptureRecorded\n-        ||rawEyeCaptureRecorded[0]||rawEyeCaptureRecorded[1];\n+        ||rawEyeCaptureRecorded[0]||rawEyeCaptureRecorded[1]\n+        ||depthProbeRecorded[0]||depthProbeRecorded[1];\n     if(kharvox::nativeXrCopyFenceRequested(s.runtimeKind,earlyReleaseRequested,nativePairReady,\n         !s.quadMode,queueSynchronized,readbackRecorded)&&s.copyFence&&s.vk.resetFences&&s.vk.waitForFences){\n         if(s.vk.resetFences(s.device,1,&s.copyFence)==VK_SUCCESS)copyCompletion=s.copyFence;\n@@ -5178,6 +5251,7 @@ void KharvoxXRPresent(VkQueue q,const VkPresentInfoKHR*p,bool* consumedPresentWa\n     }\n     if(!earlyRelease){\n         for(int e=0;e<2;++e)if(rawEyeCaptureRecorded[e])eyeSourceCapture[e].completed=true;\n+        for(int e=0;e<2;++e)if(depthProbeRecorded[e])finishDepthProbe(e);\n         if(nativeFrameValid)QueryPerformanceCounter(&nativeCompleteAt);\n         if(!copyLifetime.canRetireResources())kharvox::native::fail("owner resources retired before copy completion");\n         if(nativeXrCaptureRecorded)kharvox::native::finishXrTargetCapture();\ndiff --git a/tests/hand_scene_depth_tracker_tests.cpp b/tests/hand_scene_depth_tracker_tests.cpp\nindex 2388473..0080f51 100644\n--- a/tests/hand_scene_depth_tracker_tests.cpp\n+++ b/tests/hand_scene_depth_tracker_tests.cpp\n@@ -50,6 +50,32 @@ int main(){\n     assert(left.depthImage==depths[0]&&right.depthImage==depths[1]);\n     assert(left.depthView==depthViews[0]&&right.depthView==depthViews[1]);\n     assert(!left.reverseDepth&&right.reverseDepth);\n+    // GPU readback must reject missing transfer usage and ambiguous subresources.\n+    HandSceneTarget readable{};\n+    assert(!handSceneReadbackTarget(colors[0],extent,readable));\n+    VkImageCreateInfo readImage{VK_STRUCTURE_TYPE_IMAGE_CREATE_INFO};\n+    readImage.imageType=VK_IMAGE_TYPE_2D;readImage.extent={640,480,1};\n+    readImage.mipLevels=1;readImage.arrayLayers=1;readImage.samples=VK_SAMPLE_COUNT_1_BIT;\n+    readImage.format=VK_FORMAT_