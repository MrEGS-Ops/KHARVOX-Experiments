          new_files = json.loads('{"src/openxr/DepthProbe.inc": "// One-shot AER colour/depth readback. Included after EyeCapture.inc.\\n// Host access only occurs after the owner\'s successful GPU completion wait.\\nstruct DepthProbeCapture {\\n    VkBuffer buffer{}; VkDeviceMemory memory{}; void* mapped{};\\n    VkExtent2D extent{}; VkFormat colourFormat{},depthFormat{};\\n    VkDeviceSize planeBytes{};\\n    uint64_t frame{},revision{};\\n    bool pending{},attempted{},reverseDepth{},fromCache{};\\n};\\nstd::array<DepthProbeCapture,2> depthProbeCaptures{};\\nuint64_t depthProbeDue{};\\nstd::filesystem::path depthProbeDirectory;\\n\\nvoid releaseDepthProbe(DepthProbeCapture& c){\\n    // Call only before submission or after proven completion.\\n    if(c.mapped)s.vk.unmapMemory(s.device,c.memory);\\n    if(c.buffer)s.vk.destroyBuffer(s.device,c.buffer,nullptr);\\n    if(c.memory)s.vk.freeMemory(s.device,c.memory,nullptr);\\n    c.mapped=nullptr;c.buffer={};c.memory={};c.pending=false;\\n}\\n\\nbool recordDepthProbe(int eye,VkImage colour,VkExtent2D extent,VkFormat format,\\n                      uint64_t revision,kharvox::GameImageLifetime::Use& lifetime,\\n                      const kharvox::hands::HandSceneTarget* cachedDepth=nullptr){\\n    if(!s.upscalerProbeEnabled||!kharvox::runtimeFileExists(L\\"enable_depth_readback\\"))return false;\\n    auto& c=depthProbeCaptures[eye];\\n    if(c.attempted)return false;\\n    if(!depthProbeDue){depthProbeDue=GetTickCount64()+20000;log(\\"[UPSCALER-PROBE] capture armed; depth/colour screenshots due in 20 seconds\\",true);}\\n    if(GetTickCount64()<depthProbeDue)return false;\\n    c.attempted=true;\\n    auto reject=[&](const char* reason){log(\\"[UPSCALER-PROBE] captureSkipped eye=\\"+std::to_string(eye)+\\" reason=\\"+reason,true);return false;};\\n    if(format!=VK_FORMAT_B8G8R8A8_UNORM&&format!=VK_FORMAT_B8G8R8A8_SRGB\\n        &&format!=VK_FORMAT_R8G8B8A8_UNORM&&format!=VK_FORMAT_R8G8B8A8_SRGB)return reject(\\"colour-format\\");\\n    kharvox::hands::HandSceneTarget t{};\\n    std::string eligibility;\\n    bool targetEligible=false;\\n    const bool selected=cachedDepth?true:lifetime.select([&]{\\n        targetEligible=kharvox::hands::handSceneReadbackTarget(colour,extent,t,&eligibility);\\n        return targetEligible;\\n    },[&]{\\n        return std::array{kharvox::GameImageLifetime::key(t.colorImage),kharvox::GameImageLifetime::key(t.depthImage),\\n            kharvox::GameImageLifetime::key(t.colorView),kharvox::GameImageLifetime::key(t.depthView)};\\n    });\\n    if(cachedDepth){t=*cachedDepth;targetEligible=true;eligibility=\\"checks=passed source=per-eye-gpu-cache\\";}\\n    c.fromCache=cachedDepth!=nullptr;\\n    log(\\"[UPSCALER-PROBE] captureEligibility eye=\\"+std::to_string(eye)+\\" \\"+eligibility\\n        +\\" lifetimePinned=\\"+std::to_string(selected),true);\\n    if(!selected)return reject(targetEligible?\\"resource-retiring\\":\\"depth-eligibility-check-failed\\");\\n    if(t.depthFormat!=VK_FORMAT_D24_UNORM_S8_UINT&&t.depthFormat!=VK_FORMAT_X8_D24_UNORM_PACK32\\n        &&t.depthFormat!=VK_FORMAT_D32_SFLOAT&&t.depthFormat!=VK_FORMAT_D32_SFLOAT_S8_UINT)return reject(\\"depth-format\\");\\n    auto copy=reinterpret_cast<PFN_vkCmdCopyImageToBuffer>(s.vk.getDeviceProcAddr(s.device,\\"vkCmdCopyImageToBuffer\\"));\\n    if(!copy||!s.vk.createBuffer||!s.vk.destroyBuffer||!s.vk.getBufferMemoryRequirements\\n        ||!s.vk.allocateMemory||!s.vk.freeMemory||!s.vk.bindBufferMemory\\n        ||!s.vk.mapMemory||!s.vk.unmapMemory||!s.vk.getPhysicalDeviceMemoryProperties)return reject(\\"dispatch\\");\\n    c.planeBytes=VkDeviceSize(extent.width)*extent.height*4;\\n    if(!c.planeBytes||c.planeBytes>128ull*1024*1024)return reject(\\"size-budget\\");\\n    auto failed=[&]{releaseDepthProbe(c);return reject(\\"allocation\\");};\\n    VkBufferCreateInfo bi{VK_STRUCTURE_TYPE_BUFFER_CREATE_INFO};bi.size=c.planeBytes*2;bi.usage=VK_BUFFER_USAGE_TRANSFER_DST_BIT;\\n    if(s.vk.createBuffer(s.device,&bi,nullptr,&c.buffer)!=VK_SUCCESS)return failed();\\n    VkMemoryRequirements req{};s.vk.getBufferMemoryRequirements(s.device,c.buffer,&req);\\n    VkPhysicalDeviceMemoryProperties props{};s.vk.getPhysicalDeviceMemoryProperties(s.physical,&props);\\n    uint32_t type=UINT32_MAX;\\n    for(uint32_t i=0;i<props.memoryTypeCount;++i)if((req.memoryTypeBits&(1u<<i))\\n        &&(props.memoryTypes[i].propertyFlags&(VK_MEMORY_PROPERTY_HOST_VISIBLE_BIT|VK_MEMORY_PROPERTY_HOST_COHERENT_BIT))\\n        ==(VK_MEMORY_PROPERTY_HOST_VISIBLE_BIT|VK_MEMORY_PROPERTY_HOST_COHERENT_BIT)){type=i;break;}\\n    if(type==UINT32_MAX)return failed();\\n    VkMemoryAllocateInfo ai{VK_STRUCTURE_TYPE_MEMORY_ALLOCATE_INFO};ai.allocationSize=req.size;ai.memoryTypeIndex=type;\\n    if(s.vk.allocateMemory(s.device,&ai,nullptr,&c.memory)!=VK_SUCCESS\\n        ||s.vk.bindBufferMemory(s.device,c.buffer,c.memory,0)!=VK_SUCCESS\\n        ||s.vk.mapMemory(s.device,c.memory,0,VK_WHOLE_SIZE,0,&c.mapped)!=VK_SUCCESS)return failed();\\n    c.extent=extent;c.colourFormat=format;c.depthFormat=t.depthFormat;\\n    c.frame=s.frame;c.revision=revision;c.reverseDepth=t.reverseDepth;\\n    // Colour is already TRANSFER_SRC at the cache-copy point.\\n    VkBufferImageCopy region{};region.imageSubresource={VK_IMAGE_ASPECT_COLOR_BIT,0,0,1};region.imageExtent={extent.width,extent.height,1};\\n    copy(s.commandBuffer,colour,VK_IMAGE_LAYOUT_TRANSFER_SRC_OPTIMAL,c.buffer,1,&region);\\n    const auto aspects=kharvox::hands::handSceneDepthAspect(t.depthFormat);\\n    barrierAspect(s.commandBuffer,t.depthImage,t.depthLayout,VK_IMAGE_LAYOUT_TRANSFER_SRC_OPTIMAL,\\n        VK_ACCESS_MEMORY_READ_BIT|VK_ACCESS_MEMORY_WRITE_BIT,VK_ACCESS_TRANSFER_READ_BIT,aspects);\\n    region.bufferOffset=c.planeBytes;region.imageSubresource.aspectMask=VK_IMAGE_ASPECT_DEPTH_BIT;\\n    copy(s.commandBuffer,t.depthImage,VK_IMAGE_LAYOUT_TRANSFER_SRC_OPTIMAL,c.buffer,1,&region);\\n    barrierAspect(s.commandBuffer,t.depthImage,VK_IMAGE_LAYOUT_TRANSFER_SRC_OPTIMAL,t.depthLayout,\\n        VK_ACCESS_TRANSFER_READ_BIT,VK_ACCESS_MEMORY_READ_BIT|VK_ACCESS_MEMORY_WRITE_BIT,aspects);\\n    VkMemoryBarrier host{VK_STRUCTURE_TYPE_MEMORY_BARRIER};host.srcAccessMask=VK_ACCESS_TRANSFER_WRITE_BIT;host.dstAccessMask=VK_ACCESS_HOST_READ_BIT;\\n    s.vk.cmdPipelineBarrier(s.commandBuffer,VK_PIPELINE_STAGE_TRANSFER_BIT,VK_PIPELINE_STAGE_HOST_BIT,0,1,&host,0,nullptr,0,nullptr);\\n    c.pending=true;\\n    return true;\\n}\\n\\nvoid finishDepthProbe(int eye){\\n    auto& c=depthProbeCaptures[eye];if(!c.pending)return;\\n    const HRESULT com=CoInitializeEx(nullptr,COINIT_MULTITHREADED);\\n    try{\\n        if(depthProbeDirectory.empty()){\\n            wchar_t temp[MAX_PATH]{};if(!GetTempPathW(MAX_PATH,temp))throw std::runtime_error(\\"temp path unavailable\\");\\n            depthProbeDirectory=std::filesystem::path(temp)/L\\"KHARVOX-DepthCaptures\\"/\\n                (std::to_wstring(GetCurrentProcessId())+L\\"-\\"+std::to_wstring(GetTickCount64()));\\n            std::filesystem::create_directories(depthProbeDirectory);\\n        }\\n        const std::string prefix=eye?\\"right\\":\\"left\\";\\n        std::vector<BYTE> pixels(static_cast<size_t>(c.planeBytes));\\n        std::memcpy(pixels.data(),c.mapped,pixels.size());\\n        const bool rgba=c.colourFormat==VK_FORMAT_R8G8B8A8_UNORM||c.colourFormat==VK_FORMAT_R8G8B8A8_SRGB;\\n        for(size_t i=0;i<pixels.size();i+=4){if(rgba)std::swap(pixels[i],pixels[i+2]);pixels[i+3]=255;}\\n        bool saved=kharvox::writeEyePng(depthProbeDirectory/(prefix+\\"-colour.png\\"),c.extent.width,c.extent.height,pixels.data());\\n        const BYTE* depth=static_cast<const BYTE*>(c.mapped)+c.planeBytes;\\n        double minimum=1,maximum=0;size_t invalid=0;\\n        for(size_t i=0;i<pixels.size();i+=4){\\n            double d{};\\n            if(c.depthFormat==VK_FORMAT_D24_UNORM_S8_UINT||c.depthFormat==VK_FORMAT_X8_D24_UNORM_PACK32){\\n                uint32_t packed{};std::memcpy(&packed,depth+i,4);d=double(packed&0x00ffffffu)/16777215.0;\\n            }else{float v{};std::memcpy(&v,depth+i,4);d=v;}\\n            if(!std::isfinite(d)||d<0||d>1){++invalid;pixels[i]=255;pixels[i+1]=0;pixels[i+2]=255;}\\n            else{\\n                minimum=std::min(minimum,d);maximum=std::max(maximum,d);\\n                // Contrast-enhanced device depth, not metric/linear distance.\\n                const double nearValue=c.reverseDepth?d:1-d;\\n                const BYTE value=static_cast<BYTE>(std::lround(255*std::log1p(65535*nearValue)/std::log(65536.0)));\\n                pixels[i]=pixels[i+1]=pixels[i+2]=value;\\n            }\\n            pixels[i+3]=255;\\n        }\\n        saved=kharvox::writeEyePng(depthProbeDirectory/(prefix+\\"-depth.png\\"),c.extent.width,c.extent.height,pixels.data())&&saved;\\n        std::ofstream meta(depthProbeDirectory/(prefix+\\"-metadata.txt\\"));\\n        meta<<\\"Probe 5: snapshot of latest per-eye GPU depth cache\\\\neye=\\"<<eye<<\\"\\\\nframe=\\"<<c.frame\\n            <<\\"\\\\nfromGpuCache=\\"<<c.fromCache<<\\"\\\\ncacheRevision=\\"<<c.revision<<\\"\\\\nwidth=\\"<<c.extent.width<<\\"\\\\nheight=\\"<<c.extent.height\\n            <<\\"\\\\ndepthFormat=\\"<<c.depthFormat<<\\"\\\\nreverseDepth=\\"<<c.reverseDepth<<\\"\\\\nmin=\\"<<minimum<<\\"\\\\nmax=\\"<<maximum\\n            <<\\"\\\\ninvalidPixels=\\"<<invalid<<\\"\\\\nGPU completion verified. Same submission colour/depth; content alignment unverified.\\"\\n            <<\\"\\\\nSeparate eyes are captured on separate AER frames. White=near, black=far; logarithmic device-depth contrast.\\\\n\\";\\n        meta.close();\\n        log(\\"[UPSCALER-PROBE] captureSaved=\\"+std::to_string(saved&&bool(meta))+\\" eye=\\"+std::to_string(eye)\\n            +\\" directory=\\"+depthProbeDirectory.string(),true);\\n    }catch(const std::exception& ex){log(std::string(\\"[UPSCALER-PROBE] capture write failed: \\")+ex.what(),true);}\\n    if(SUCCEEDED(com))CoUninitialize();\\n    releaseDepthProbe(c);\\n}\\n", "src/vulkan/DepthProbeImageCreation.h": "#pragma once\\n#include <vulkan/vulkan.h>\\n\\nnamespace kharvox::depthprobe {\\n// Restricted to the image configuration observed in Eddy\'s Probe 3b capture.\\n// Unknown extension chains may alter usage or memory requirements: leave them alone.\\ninline bool candidate(const VkImageCreateInfo& i) {\\n    return !i.pNext && !i.flags && i.imageType==VK_IMAGE_TYPE_2D\\n        && i.format==VK_FORMAT_D24_UNORM_S8_UINT\\n        && i.extent.width==4736 && i.extent.height==2664 && i.extent.depth==1\\n        && i.mipLevels==1 && i.arrayLayers==1 && i.samples==VK_SAMPLE_COUNT_1_BIT\\n        && i.tiling==VK_IMAGE_TILING_OPTIMAL\\n        && i.usage==(VK_IMAGE_USAGE_DEPTH_STENCIL_ATTACHMENT_BIT|VK_IMAGE_USAGE_SAMPLED_BIT);\\n}\\nstruct CreationResult {\\n    VkResult result{};\\n    VkImageUsageFlags actualUsage{};\\n    bool queried{},supported{},attempted{},fallback{};\\n};\\ninline CreationResult create(VkDevice device,VkPhysicalDevice physical,\\n    const VkImageCreateInfo& original,const VkAllocationCallbacks* allocator,VkImage* image,\\n    PFN_vkCreateImage createImage,PFN_vkGetPhysicalDeviceImageFormatProperties query) {\\n    CreationResult status{};\\n    status.actualUsage=original.usage;\\n    VkImageCreateInfo effective=original;\\n    if(candidate(original)&&physical&&query){\\n        status.queried=true;\\n        effective.usage|=VK_IMAGE_USAGE_TRANSFER_SRC_BIT;\\n        VkImageFormatProperties limits{};\\n        status.supported=query(physical,effective.format,effective.imageType,effective.tiling,\\n            effective.usage,effective.flags,&limits)==VK_SUCCESS\\n            && effective.extent.width<=limits.maxExtent.width\\n            && effective.extent.height<=limits.maxExtent.height\\n            && effective.extent.depth<=limits.maxExtent.depth\\n            && effective.mipLevels<=limits.maxMipLevels\\n            && effective.arrayLayers<=limits.maxArrayLayers\\n            && (limits.sampleCounts&effective.samples);\\n        if(status.supported){\\n            status.attempted=true;\\n            status.result=createImage(device,&effective,allocator,image);\\n            if(status.result==VK_SUCCESS){status.actualUsage=effective.usage;return status;}\\n            status.fallback=true;\\n        }\\n    }\\n    status.result=createImage(device,&original,allocator,image);\\n    return status;\\n}\\n} // namespace kharvox::depthprobe\\n", "tests/depth_probe_image_creation_tests.cpp": "#include \\"../src/vulkan/DepthProbeImageCreation.h\\"\\n#include <cassert>\\n#include <vector>\\nusing namespace kharvox::depthprobe;\\nstatic std::vector<VkImageUsageFlags> calls;\\nstatic bool support=true,failModified=false;\\nstatic uint32_t maxWidth=8192;\\nstatic VKAPI_ATTR VkResult VKAPI_CALL query(VkPhysicalDevice,VkFormat,VkImageType,VkImageTiling,\\n    VkImageUsageFlags usage,VkImageCreateFlags,VkImageFormatProperties* out){\\n    assert(usage==37);\\n    *out={{maxWidth,8192,1},1,1,VK_SAMPLE_COUNT_1_BIT,1024ull*1024*1024};\\n    return support?VK_SUCCESS:VK_ERROR_FORMAT_NOT_SUPPORTED;\\n}\\nstatic VKAPI_ATTR VkResult VKAPI_CALL make(VkDevice,const VkImageCreateInfo* i,const VkAllocationCallbacks*,VkImage*){\\n    calls.push_back(i->usage);\\n    return failModified&&(i->usage&VK_IMAGE_USAGE_TRANSFER_SRC_BIT)?VK_ERROR_OUT_OF_DEVICE_MEMORY:VK_SUCCESS;\\n}\\nint main(){\\n    VkImageCreateInfo i{VK_STRUCTURE_TYPE_IMAGE_CREATE_INFO};\\n    i.imageType=VK_IMAGE_TYPE_2D;i.format=VK_FORMAT_D24_UNORM_S8_UINT;\\n    i.extent={4736,2664,1};i.mipLevels=1;i.arrayLayers=1;i.samples=VK_SAMPLE_COUNT_1_BIT;\\n    i.tiling=VK_IMAGE_TILING_OPTIMAL;i.usage=36;\\n    auto physical=reinterpret_cast<VkPhysicalDevice>(1);\\n    assert(candidate(i));\\n    auto r=create({},physical,i,nullptr,nullptr,make,query);\\n    assert(r.result==VK_SUCCESS&&r.actualUsage==37&&r.attempted&&!r.fallback);\\n    assert(calls==std::vector<VkImageUsageFlags>{37}&&i.usage==36);\\n    calls.clear();failModified=true;\\n    r=create({},physical,i,nullptr,nullptr,make,query);\\n    assert(r.result==VK_SUCCESS&&r.actualUsage==36&&r.fallback);\\n    assert((calls==std::vector<VkImageUsageFlags>{37,36}));\\n    calls.clear();failModified=false;support=false;\\n    r=create({},physical,i,nullptr,nullptr,make,query);\\n    assert(r.queried&&!r.supported&&!r.attempted&&r.actualUsage==36);\\n    assert(calls==std::vector<VkImageUsageFlags>{36});\\n    calls.clear();support=true;maxWidth=4096;\\n    r=create({},physical,i,nullptr,nullptr,make,query);\\n    assert(!r.supported&&calls==std::vector<VkImageUsageFlags>{36});\\n    calls.clear();maxWidth=8192;\\n    r=create({},physical,i,nullptr,nullptr,make,nullptr);\\n    assert(!r.queried&&calls==std::vector<VkImageUsageFlags>{36});\\n    auto altered=i;altered.pNext=&i;assert(!candidate(altered));\\n    altered=i;altered.usage|=VK_IMAGE_USAGE_TRANSIENT_ATTACHMENT_BIT;assert(!candidate(altered));\\n    altered=i;altered.flags=VK_IMAGE_CREATE_ALIAS_BIT;assert(!candidate(altered));\\n    altered=i;altered.extent.width=1024;assert(!candidate(altered));\\n    altered=i;altered.arrayLayers=2;assert(!candidate(altered));\\n    altered=i;altered.samples=VK_SAMPLE_COUNT_4_BIT;assert(!candidate(altered));\\n    calls.clear();\\n    r=create({},physical,altered,nullptr,nullptr,make,query);\\n    assert(!r.queried&&calls==std::vector<VkImageUsageFlags>{36});\\n}\\n", "src/openxr/EyeDepthCache.h": "#pragma once\\n#include \\"OpenXRBootstrap.h\\"\\n#include \\"../hands/HandSceneDepthTracker.h\\"\\n\\nnamespace kharvox {\\n// Latest depth for one eye, paired with that eye\'s existing colour-cache revision.\\n// This is not multi-frame reconstruction/history. The owner must confirm GPU\\n// completion before reuse and must invalidate on colour-history resets.\\nclass EyeDepthCache {\\npublic:\\n    VkImage image{};\\n    VkDeviceMemory memory{};\\n    VkExtent2D extent{};\\