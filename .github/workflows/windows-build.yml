name: KHARVOX Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Download source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Configure native build
        run: >
          cmake -S . -B build/native
          -G "Visual Studio 17 2022" -A x64
          -DKHARVOX_BUILD_LAYER=ON
          -DBUILD_TESTING=OFF

      - name: Compile native components
        run: cmake --build build/native --config Release --parallel 2

      - name: Compile launcher
        run: >
          dotnet build launcher/KharvoxLauncher/KharvoxLauncher.csproj
          --configuration Release
          --output build/launcher

      - name: Save build outputs
        uses: actions/upload-artifact@v4
        with:
          name: KHARVOX-Baseline-Build
          retention-days: 7
          if-no-files-found: error
          path: |
            build/native/Release/
            build/launcher/
            LICENSE.txt
            Docs/THIRD_PARTY_NOTICES.txt
